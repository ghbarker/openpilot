<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0d0f14">
<title>Steering — BluePilot</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #0d0f14; color: #e8e9ec; overflow: hidden;
               font: 14px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { display: flex; flex-direction: column; height: 100%; }

  header { display: flex; align-items: center; gap: 14px; padding: 8px 12px;
           border-bottom: 1px solid #22262e; flex-wrap: wrap; }
  .stat { display: flex; flex-direction: column; min-width: 58px; }
  .stat .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 10px; color: #8b8f98; text-transform: uppercase; letter-spacing: .06em; }
  .stat .v.on  { color: #4cd07d; }
  .stat .v.off { color: #8b8f98; }
  #hdrright { margin-left: auto; display: flex; align-items: center; gap: 10px; min-width: 0; }
  #autocal { font-size: 11px; color: #8b8f98; text-align: right; display: none;
             max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #bandpill { background: #24344d; color: #9ec7ff; padding: 5px 13px; border-radius: 15px;
              font-size: 12px; font-weight: 600; white-space: nowrap; }
  #conn { width: 9px; height: 9px; border-radius: 50%; background: #d64545; flex: none; }
  #conn.ok { background: #4cd07d; }

  /* --- calibration dashboard cards ------------------------------------------------------ */
  #cards { display: none; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
           gap: 10px; padding: 0 10px 10px; }
  .card { background: #151920; border-radius: 14px; padding: 12px 14px; min-width: 0; }
  .chead { display: flex; justify-content: space-between; gap: 8px; font-size: 12px;
           color: #8b8f98; margin-bottom: 6px; }
  .chead .cband { font-weight: 600; color: #aab0ba; }
  .csamp { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .cbig { font-size: clamp(17px, 2.4vw + 12px, 26px); font-weight: 800; line-height: 1.2;
          margin-bottom: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cbar { position: relative; height: 6px; border-radius: 3px; background: #262b34;
          margin-bottom: 8px; }
  .cfill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px;
           transition: width .4s; }
  .ctick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #e8e9ec; }
  .cfoot { font-size: 13px; color: #aab0ba; overflow: hidden; text-overflow: ellipsis;
           white-space: nowrap; }
  .cfoot .try { color: #4cd07d; font-weight: 700; }
  .cfoot .warn { color: #e8935a; }
  .c-collect { color: #8b8f98; } .cfill.c-collect { background: #4a5160; }
  .c-off     { color: #e8935a; } .cfill.c-off     { background: #e8935a; }
  .c-good    { color: #4cd07d; } .cfill.c-good    { background: #4cd07d; }
  .c-verify  { color: #4da3ff; } .cfill.c-verify  { background: #4da3ff; }

  #graphwrap { flex: 1; position: relative; min-height: 110px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }


  .legend { position: absolute; top: 6px; left: 10px; display: flex; gap: 14px; font-size: 12px; }
  .legend span::before { content: ""; display: inline-block; width: 14px; height: 3px;
                         border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  .legend .des::before { background: #4da3ff; }
  .legend .act::before { background: #4cd07d; }
  #pausedbadge { position: absolute; top: 6px; right: 10px; font-size: 12px; font-weight: 700;
                 color: #ffb84d; display: none; letter-spacing: .05em; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="conn" title="stream status"></div>
    <div class="stat"><div class="v" id="mph">--</div><div class="l">mph</div></div>
    <div class="stat"><div class="v" id="lat">--</div><div class="l">lateral</div></div>
    <div class="stat"><div class="v" id="err">--</div><div class="l">err °</div></div>
    <div class="stat"><div class="v" id="factors" style="font-size:13px"></div>
         <div class="l">low / high</div></div>
    <div id="hdrright">
      <div id="autocal"></div>
      <div id="bandpill">connecting…</div>
    </div>
  </header>

  <div id="graphwrap">
    <canvas id="graph"></canvas>
    <div class="legend"><span class="des">Desired</span><span class="act">Actual</span></div>
    <div id="pausedbadge">PAUSED — tap to resume</div>
  </div>

  <div id="cards">
    <div class="card" id="card-low"></div>
    <div class="card" id="card-high"></div>
  </div>

</div>

<script>
'use strict';
// ---- state ------------------------------------------------------------------------------
const WINDOW_S = 12;              // rolling window, mirrors the on-device feel but longer
const buf = [];                   // {t, des, act}
let paused = false;
let lastFrameWall = 0;

// ---- stream -----------------------------------------------------------------------------
const conn = document.getElementById('conn');
function connect() {
  const es = new EventSource('/api/lateral/stream');
  es.onopen  = () => conn.classList.add('ok');
  es.onerror = () => { conn.classList.remove('ok'); es.close(); setTimeout(connect, 2000); };
  es.onmessage = (ev) => {
    const d = JSON.parse(ev.data);
    lastFrameWall = performance.now();
    if (!paused && Math.abs(d.desired_deg) < 600 && Math.abs(d.actual_deg) < 600) {
      buf.push({ t: d.t, des: d.desired_deg, act: d.actual_deg });
      const cut = d.t - WINDOW_S;
      while (buf.length && buf[0].t < cut) buf.shift();
    }
    document.getElementById('mph').textContent = d.v_mph.toFixed(0);
    const lat = document.getElementById('lat');
    lat.textContent = d.lat_active ? 'ON' : 'off';
    lat.className = 'v ' + (d.lat_active ? 'on' : 'off');
    document.getElementById('err').textContent = (d.desired_deg - d.actual_deg).toFixed(1);
    document.getElementById('factors').textContent =
      (d.low_factor && d.high_factor)
        ? `factors ${d.low_factor.toFixed(2)} / ${d.high_factor.toFixed(2)}`
        : '';
    renderBandPill(d.v_mph);
    renderCards(d);
  };
}
connect();

// ---- calibration dashboard --------------------------------------------------------------
// Band edges mirror values_ext.py: V_LOW 13.5 m/s ≈ 30 mph, V_HIGH 26.82 m/s ≈ 60 mph.
const V_LOW_MPH = 30, V_HIGH_MPH = 60;
function bandName(mph) {
  return mph < V_LOW_MPH ? 'low band' : mph > V_HIGH_MPH ? 'high band' : 'blend zone';
}
function renderBandPill(mph) {
  document.getElementById('bandpill').textContent = `${mph.toFixed(0)} mph · ${bandName(mph)}`;
}

function cardHTML(title, o) {
  const tick = o.tick != null ? `<div class="ctick" style="left:${o.tick}%"></div>` : '';
  return `<div class="chead"><span class="cband">${title}</span><span class="csamp">${o.samp || ''}</span></div>` +
         `<div class="cbig ${o.cls}">${o.big}</div>` +
         `<div class="cbar"><div class="cfill ${o.cls}" style="width:${o.fill}%"></div>${tick}</div>` +
         `<div class="cfoot">${o.foot || ''}</div>`;
}

// Response bar: 0 → 110% of requested, with a tick marking exactly-as-requested (100%).
function respBar(r) {
  return { fill: Math.max(0, Math.min(110, r * 100)) / 1.1, tick: 100 / 1.1 };
}

function bandCard(b, hint) {
  // b: per-anchor state from the controller — {f,w,need,r,ph,t,to,vw,vneed,vr}
  const o = { samp: '', big: '', cls: 'c-collect', fill: 0, tick: null, foot: '' };
  const vr = b.vr === 'confirmed' ? ' · last step confirmed ✓'
           : b.vr === 'failed' ? ' · <span class="warn">last step didn\'t verify — gathering more</span>' : '';
  if (b.ph === 'verify') {
    o.cls = 'c-verify';
    o.big = `checking ${b.to.toFixed(2)}…`;
    o.samp = `${b.vw.toFixed(0)} of ${b.vneed}s fresh`;
    o.fill = Math.min(100, b.vw / b.vneed * 100);
    o.foot = `watching the response at the new factor`;
  } else if (b.ph === 'propose') {
    const bar = respBar(b.r != null ? b.r : 1);
    o.cls = 'c-off';
    o.big = b.r != null ? `turns ${(b.r * 100).toFixed(0)}% of requested` : 'adjustment ready';
    o.samp = `${b.w.toFixed(0)}s evidence`;
    o.fill = bar.fill; o.tick = bar.tick;
    o.foot = `factor ${b.f.toFixed(2)} → <span class="try">try ${b.t.toFixed(2)}</span>${vr}`;
  } else if (b.ph === 'good') {
    const bar = respBar(b.r != null ? b.r : 1);
    o.cls = 'c-good';
    o.big = b.r != null ? `turns ${(b.r * 100).toFixed(0)}% of requested` : 'calibrated';
    o.samp = `${b.w.toFixed(0)}s evidence`;
    o.fill = bar.fill; o.tick = bar.tick;
    o.foot = `factor ${b.f.toFixed(2)} ✓ nothing to change${vr}`;
  } else { // collect
    o.big = 'collecting…';
    o.samp = `${b.w.toFixed(0)} of ${b.need}s`;
    o.fill = Math.min(100, b.w / b.need * 100);
    o.foot = hint + vr;
  }
  return o;
}

const cardsEl = document.getElementById('cards');
const cardLow = document.getElementById('card-low');
const cardHigh = document.getElementById('card-high');
const autocalEl = document.getElementById('autocal');
function renderCards(d) {
  const s = d.autocal || '';
  let show = false, fallback = '';
  if (s === 'locked') {
    show = true;
    const lk = (f) => ({ samp: '', big: 'locked ✓', cls: 'c-good', fill: 100, tick: null,
                         foot: f != null ? `factor ${f.toFixed(2)}` : '' });
    cardLow.innerHTML = cardHTML('Low band · under 30 mph', lk(d.low_factor));
    cardHigh.innerHTML = cardHTML('High band · over 60 mph', lk(d.high_factor));
  } else if (s === 'reset') {
    show = true;
    const rs = { samp: '', big: 'memory erased', cls: 'c-collect', fill: 0, tick: null,
                 foot: 'starting a fresh collection' };
    cardLow.innerHTML = cardHTML('Low band · under 30 mph', rs);
    cardHigh.innerHTML = cardHTML('High band · over 60 mph', rs);
  } else if (s[0] === '{') {
    let st = null;
    try { st = JSON.parse(s); } catch (e) { st = null; }
    if (st && st.low && st.high) {
      show = true;
      cardLow.innerHTML = cardHTML('Low band · under 30 mph',
        bandCard(st.low, 'drive curves under 30 mph to collect data'));
      cardHigh.innerHTML = cardHTML('High band · over 60 mph',
        bandCard(st.high, 'drive curves above 60 mph to collect data'));
    } else {
      fallback = s;
    }
  } else if (s && s !== 'off') {
    fallback = s;  // legacy / tick-error strings stay visible rather than vanishing
  }
  cardsEl.style.display = show ? 'grid' : 'none';
  autocalEl.style.display = fallback ? 'block' : 'none';
  autocalEl.textContent = fallback;
}

// ---- tap to pause/resume (whole graph is the control — no chrome) -----------------------
document.getElementById('graphwrap').addEventListener('click', () => {
  paused = !paused;
  document.getElementById('pausedbadge').style.display = paused ? 'block' : 'none';
});

// ---- graph ------------------------------------------------------------------------------
const cv = document.getElementById('graph');
const ctx = cv.getContext('2d');
function draw() {
  const w = cv.clientWidth, h = cv.clientHeight, dpr = window.devicePixelRatio || 1;
  if (cv.width !== w * dpr || cv.height !== h * dpr) {
    cv.width = w * dpr; cv.height = h * dpr;
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const padL = 40, padR = 8, padT = 10, padB = 20;
  const gw = w - padL - padR, gh = h - padT - padB;

  // autoscale: symmetric about zero, min ±5°, headroom
  let m = 5;
  for (const p of buf) m = Math.max(m, Math.abs(p.des), Math.abs(p.act));
  m *= 1.15;
  const t1 = buf.length ? buf[buf.length - 1].t : 0;
  const x = (t) => padL + gw * (1 - (t1 - t) / WINDOW_S);
  const y = (v) => padT + gh * (0.5 - v / (2 * m));

  // grid + labels
  ctx.strokeStyle = '#1d222b'; ctx.fillStyle = '#666c78';
  ctx.font = '11px sans-serif'; ctx.textAlign = 'right'; ctx.lineWidth = 1;
  const rawStep = (2 * m) / 8;
  const pow10 = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const step = [1, 2, 5, 10].map(k => k * pow10).find(s => s >= rawStep) || 10 * pow10;
  for (let v = -Math.floor(m / step) * step; v <= m; v += step) {
    ctx.beginPath(); ctx.moveTo(padL, y(v)); ctx.lineTo(w - padR, y(v)); ctx.stroke();
    ctx.fillText(v + '°', padL - 5, y(v) + 4);
  }
  ctx.strokeStyle = '#2a3038';
  ctx.beginPath(); ctx.moveTo(padL, y(0)); ctx.lineTo(w - padR, y(0)); ctx.stroke();

  // time ticks every 2 s
  ctx.textAlign = 'center';
  for (let s = 0; s <= WINDOW_S; s += 2) {
    const tx = x(t1 - s);
    if (tx >= padL) ctx.fillText(s === 0 ? 'now' : '-' + s + 's', tx, h - 6);
  }

  const trace = (key, color) => {
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.beginPath();
    let started = false;
    for (const p of buf) {
      const px = x(p.t), py = y(p[key]);
      if (!started) { ctx.moveTo(px, py); started = true; } else ctx.lineTo(px, py);
    }
    ctx.stroke();
  };
  trace('des', '#4da3ff');
  trace('act', '#4cd07d');

  // stale-stream veil
  if (performance.now() - lastFrameWall > 2000) {
    ctx.fillStyle = 'rgba(13,15,20,0.55)'; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#8b8f98'; ctx.textAlign = 'center'; ctx.font = '15px sans-serif';
    ctx.fillText('waiting for data…', w / 2, h / 2);
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// keep the screen awake while watching, where supported
if ('wakeLock' in navigator) {
  let lock = null;
  const acquire = () => navigator.wakeLock.request('screen').then(l => lock = l).catch(() => {});
  acquire();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') acquire();
  });
}
</script>
</body>
</html>
