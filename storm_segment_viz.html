const T0 = 175, T1 = 240;   // window of interest (storm = ~182-229)
const W = document.body.clientWidth - 40, H = 150;
function clock(rel){const s=D.clock0+rel;const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=(s%60).toFixed(0).padStart(2,'0');return `${h}:${String(m).padStart(2,'0')}:${ss}`}
function mk(title, legendHtml){
  const div=document.getElementById('plots');
  const h2=document.createElement('h2');h2.textContent=title;div.appendChild(h2);
  if(legendHtml){const lg=document.createElement('div');lg.className='legend';lg.innerHTML=legendHtml;div.appendChild(lg)}
  const c=document.createElement('canvas');c.width=W;c.height=H;div.appendChild(c);
  return c.getContext('2d');
}
function x(t){return (t-T0)/(T1-T0)*W}
function line(ctx, pts, ti, vi, vmin, vmax, color){
  ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.beginPath();let started=false;
  for(const p of pts){const t=p[ti];if(t<T0||t>T1)continue;
    const y=H-8-((p[vi]-vmin)/(vmax-vmin))*(H-16);
    if(!started){ctx.moveTo(x(t),y);started=true}else ctx.lineTo(x(t),y)}
  ctx.stroke();
}
function bands(ctx, pts, ti, vi, color){
  ctx.fillStyle=color;
  for(let i=0;i<pts.length;i++){const p=pts[i];if(p[ti]<T0||p[ti]>T1)continue;
    if(p[vi]>0.5){const t2=(i+1<pts.length)?pts[i+1][ti]:p[ti]+0.1;
      ctx.fillRect(x(p[ti]),0,Math.max(1,x(t2)-x(p[ti])),H)}}
}
function marks(ctx, ts, color, w){ctx.fillStyle=color;for(const t of ts){if(t>=T0&&t<=T1)ctx.fillRect(x(t)-w/2,0,w,H)}}
function axis(ctx){ctx.fillStyle='#666';ctx.font='11px sans-serif';
  for(let t=Math.ceil(T0/10)*10;t<=T1;t+=10){ctx.fillRect(x(t),H-5,1,5);ctx.fillText(clock(t),x(t)+2,H-8)}
  ctx.strokeStyle='#333';ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke()}
